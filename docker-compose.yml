services:
  cloud-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rahul-cloud-portfolio
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - NODE_ENV=production
    labels:
      - "app=cloud-portfolio"
      - "maintainer=rahul.clouddevops@gmail.com"
